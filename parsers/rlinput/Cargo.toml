[package]
name = "rlinput"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
sim = ["dep:rocketsim_rs"]

[dependencies]
bitflags = { version = "2", features = ["serde"] }
rocketsim_rs = { version = "=0.37.0", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
